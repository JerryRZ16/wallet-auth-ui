<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开户成功</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="container">
        <!-- 头部导航 -->
        <header class="header">
            <div class="header-placeholder"></div>
            <h1 class="header-title">开户成功</h1>
            <div class="header-placeholder"></div>
        </header>

        <!-- 内容区域 -->
        <main class="content">
            <div class="section success-section">
                <!-- 成功图标 -->
                <div class="success-icon-large">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>

                <h2 class="success-title">开户成功</h2>

                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <button class="primary-btn" id="goToWallet">前往钱包首页</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('goToWallet').addEventListener('click', function() {
                alert('即将跳转到钱包首页');
            });
        });
    </script>
</body>
</html>
