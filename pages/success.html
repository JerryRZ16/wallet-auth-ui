<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开户成功</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="container">
        <!-- 头部导航 -->
        <header class="header">
            <div class="header-placeholder"></div>
            <h1 class="header-title">开户成功</h1>
            <div class="header-placeholder"></div>
        </header>

        <!-- 内容区域 -->
        <main class="content">
            <div class="section success-section">
                <!-- 成功图标 -->
                <div class="success-icon-large">
                    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </div>

                <h2 class="success-title">恭喜您，钱包开户成功！</h2>
                <p class="success-desc">您的企业钱包已开通，可开始使用收付款功能</p>
                
                <!-- 成功信息卡片 -->
                <div class="success-info-card">
                    <div class="info-row">
                        <span class="info-label">商户名称</span>
                        <span class="info-value">杭州XX科技有限公司</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">商户编号</span>
                        <span class="info-value">MCH20240508001</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">开通时间</span>
                        <span class="info-value" id="openTime">2024-05-08 10:30:00</span>
                    </div>
                </div>

                <!-- 下一步提示 -->
                <div class="next-steps">
                    <h4 class="steps-title">接下来您可以：</h4>
                    <ul class="steps-list">
                        <li>前往钱包首页查看账户余额</li>
                        <li>绑定结算银行卡</li>
                        <li>配置收款通知方式</li>
                    </ul>
                </div>

                <!-- 操作按钮 -->
                <div class="action-buttons">
                    <button class="primary-btn" id="goToWallet">前往钱包首页</button>
                    <button class="outline-btn" id="bindCard">绑定结算卡</button>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 设置当前时间
        document.addEventListener('DOMContentLoaded', function() {
            const now = new Date();
            const timeStr = now.getFullYear() + '-' + 
                String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                String(now.getDate()).padStart(2, '0') + ' ' + 
                String(now.getHours()).padStart(2, '0') + ':' + 
                String(now.getMinutes()).padStart(2, '0') + ':' + 
                String(now.getSeconds()).padStart(2, '0');
            document.getElementById('openTime').textContent = timeStr;

            // 前往钱包首页按钮
            document.getElementById('goToWallet').addEventListener('click', function() {
                alert('即将跳转到钱包首页');
            });

            // 绑定结算卡按钮
            document.getElementById('bindCard').addEventListener('click', function() {
                alert('即将跳转到银行卡绑定页面');
            });
        });
    </script>
</body>
</html>
